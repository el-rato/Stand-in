# Daily Postgres backup: pg_dump to a versioned artifact (30-day retention).
# Needs repository secret DATABASE_URL. Manual runs via workflow_dispatch.
# This complements (not replaces) your provider's point-in-time recovery.
name: daily-backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        run: pg_dump "$DATABASE_URL" --format=custom --file="standin-$(date +%F).dump"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: standin-backup-$(date +%F)
          path: standin-*.dump
          retention-days: 30
